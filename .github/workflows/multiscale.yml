name: multiscale

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-multiscale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python exact/generate_multiscale.py --check
      - run: python exact/verify_multiscale.py --check
      - run: git diff --exit-code -- data/multiscale-v1 certificates/multiscale-v1.json
